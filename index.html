document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ietnamese */\n@font-face {\n  font-family: 'Manrope';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"45876e7e-17ce-4571-a01e-318215458cb4\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Manrope';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"dacadcbe-b874-44dc-90f4-7f39f2d8bf8b\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Manrope';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"33b29e1b-eda9-4f05-b287-fbba3b2dea3e\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  :root{\n    --cream:#f4f0e9;\n    --cream-2:#efeae1;\n    --paper:#faf8f3;\n    --ink:#2c2a26;\n    --ink-soft:#5b574f;\n    --ink-faint:#928d83;\n    --line:#ddd6ca;\n    --sage:#9aa896;\n    --sage-deep:#788570;\n    --tg:#27a7e7;\n    --serif:\"Cormorant\", Georgia, serif;\n    --sans:\"Manrope\", system-ui, sans-serif;\n  }\n  *{box-sizing:border-box;margin:0;padding:0;}\n  html{-webkit-text-size-adjust:100%;}\n  body{\n    font-family:var(--sans);\n    background:var(--cream);\n    color:var(--ink);\n    font-weight:400;\n    line-height:1.6;\n    -webkit-font-smoothing:antialiased;\n    text-rendering:optimizeLegibility;\n  }\n  .wrap{\n    max-width:680px;\n    margin:0 auto;\n    padding:0 28px;\n  }\n\n  /* ---- shared type ---- */\n  .kicker{\n    font-size:11.5px;\n    letter-spacing:0.32em;\n    text-transform:uppercase;\n    color:var(--ink-faint);\n    font-weight:500;\n  }\n  .serif{font-family:var(--serif);}\n  h2.section-title{\n    font-family:var(--serif);\n    font-weight:500;\n    font-size:clamp(30px,7vw,42px);\n    line-height:1.05;\n    letter-spacing:0.01em;\n    margin-top:14px;\n  }\n  .rule{height:1px;background:var(--line);border:0;width:100%;}\n\n  /* ---- header ---- */\n  header.top{\n    padding:26px 0 6px;\n  }\n  header.top .wrap{\n    display:flex;\n    align-items:center;\n    justify-content:space-between;\n  }\n  .brand{\n    font-family:var(--serif);\n    font-size:21px;\n    font-weight:600;\n    letter-spacing:0.02em;\n  }\n  .brand span{color:var(--ink-faint);font-weight:500;}\n  .top-mk{\n    font-size:11px;\n    letter-spacing:0.28em;\n    text-transform:uppercase;\n    color:var(--ink-faint);\n  }\n\n  /* ---- hero ---- */\n  .hero{\n    padding:46px 0 30px;\n    text-align:center;\n  }\n  .hero .label{margin-bottom:22px;}\n  .hero h1{\n    font-family:var(--serif);\n    font-weight:500;\n    font-size:clamp(64px,22vw,128px);\n    line-height:0.92;\n    letter-spacing:0.02em;\n  }\n  .hero .quote{\n    display:block;\n    font-size:0.42em;\n    letter-spacing:0.04em;\n    color:var(--ink-faint);\n  }\n  .hero .sub{\n    font-family:var(--serif);\n    font-style:italic;\n    font-size:clamp(22px,6vw,30px);\n    color:var(--sage-deep);\n    margin-top:6px;\n  }\n  .hero .lead{\n    max-width:430px;\n    margin:22px auto 0;\n    font-size:16px;\n    color:var(--ink-soft);\n    font-weight:300;\n    text-wrap:pretty;\n  }\n\n  /* ---- image slot ---- */\n  image-slot{\n    display:block;\n    width:100%;\n    background:var(--cream-2);\n  }\n  .hero-img{\n    aspect-ratio:4/5;\n    margin:34px auto 0;\n    max-width:440px;\n  }\n  .slot-cap{\n    font-size:11px;\n    letter-spacing:0.18em;\n    text-transform:uppercase;\n    color:var(--ink-faint);\n    text-align:center;\n    margin-top:12px;\n  }\n\n  /* ---- buttons ---- */\n  .cta{\n    display:inline-flex;\n    align-items:center;\n    justify-content:center;\n    gap:12px;\n    white-space:nowrap;\n    background:var(--ink);\n    color:var(--paper);\n    text-decoration:none;\n    font-weight:500;\n    font-size:16px;\n    letter-spacing:0.01em;\n    padding:18px 30px;\n    border-radius:999px;\n    transition:transform .25s ease, background .25s ease;\n  }\n  .cta:hover{background:#1d1b18;transform:translateY(-2px);}\n  .cta .tg{\n    display:inline-flex;\n    width:24px;height:24px;\n    border-radius:50%;\n    background:var(--tg);\n    align-items:center;justify-content:center;\n    flex:0 0 auto;\n  }\n  .cta .tg svg{width:14px;height:14px;display:block;}\n  .cta .price{\n    font-family:var(--serif);\n    font-size:20px;\n    font-weight:600;\n    padding-left:12px;\n    margin-left:2px;\n    border-left:1px solid rgba(250,248,243,.28);\n  }\n  .cta-note{\n    font-size:12.5px;\n    color:var(--ink-faint);\n    letter-spacing:0.02em;\n    margin-top:14px;\n  }\n  .cta-wrap{text-align:center;}\n\n  /* ---- generic section ---- */\n  section{padding:54px 0;}\n  section .head{margin-bottom:30px;}\n\n  /* about list */\n  .deflist{display:flex;flex-direction:column;gap:26px;}\n  .deflist .row .t{\n    font-size:11.5px;letter-spacing:0.26em;text-transform:uppercase;\n    color:var(--ink-faint);font-weight:500;margin-bottom:7px;\n  }\n  .deflist .row .d{\n    font-size:17.5px;color:var(--ink);font-weight:300;line-height:1.55;\n    text-wrap:pretty;\n  }\n  .deflist .row .d b{font-weight:600;}\n\n  /* format cards */\n  .format{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--line);}\n  .format li{\n    list-style:none;\n    display:flex;gap:18px;align-items:baseline;\n    padding:20px 2px;\n    border-bottom:1px solid var(--line);\n  }\n  .format li .n{\n    font-family:var(--serif);font-size:20px;color:var(--sage-deep);\n    flex:0 0 24px;font-weight:500;\n  }\n  .format li .x{font-size:16.5px;font-weight:300;color:var(--ink);line-height:1.5;}\n  .format li .x b{font-weight:600;}\n\n  /* sizes table */\n  .sizes{width:100%;border-collapse:collapse;font-size:16px;}\n  .sizes thead th{\n    text-align:left;font-weight:500;font-size:11px;letter-spacing:0.2em;\n    text-transform:uppercase;color:var(--ink-faint);\n    padding:0 0 14px;border-bottom:1px solid var(--line);\n  }\n  .sizes thead th.r{text-align:right;}\n  .sizes td{\n    padding:15px 0;border-bottom:1px solid var(--line);font-weight:300;\n  }\n  .sizes td.val{text-align:right;font-family:var(--serif);font-size:19px;font-weight:500;color:var(--ink);}\n  .sizes td .unit{font-size:13px;color:var(--ink-faint);font-family:var(--sans);margin-left:3px;}\n\n  /* materials */\n  .mat-yarn{\n    background:var(--paper);\n    border:1px solid var(--line);\n    border-radius:18px;\n    padding:26px;\n    margin-bottom:26px;\n  }\n  .mat-yarn .t{font-size:11.5px;letter-spacing:0.26em;text-transform:uppercase;color:var(--ink-faint);font-weight:500;margin-bottom:10px;}\n  .mat-yarn p{font-size:17px;font-weight:300;line-height:1.55;color:var(--ink);text-wrap:pretty;}\n  .mat-yarn p b{font-weight:600;}\n  .tools{\n    display:grid;grid-template-columns:1fr 1fr;gap:0 28px;\n  }\n  .tools li{\n    list-style:none;\n    font-size:15.5px;font-weight:300;\n    padding:13px 0;border-bottom:1px solid var(--line);\n    display:flex;gap:11px;align-items:baseline;\n  }\n  .tools li::before{\n    content:\"\";flex:0 0 5px;width:5px;height:5px;border-radius:50%;\n    background:var(--sage);transform:translateY(-3px);\n  }\n\n  /* price block */\n  .price-block{\n    background:var(--ink);\n    color:var(--paper);\n    border-radius:26px;\n    padding:48px 30px 44px;\n    text-align:center;\n  }\n  .price-block .kicker{color:rgba(250,248,243,.55);}\n  .price-block .amount{\n    font-family:var(--serif);\n    font-size:clamp(58px,18vw,90px);\n    font-weight:500;\n    line-height:1;\n    margin:14px 0 6px;\n    letter-spacing:0.01em;\n  }\n  .price-block .amount .cur{font-size:0.5em;color:var(--sage);margin-left:6px;}\n  .price-block .pdesc{\n    color:rgba(250,248,243,.62);font-weight:300;font-size:15.5px;\n    max-width:360px;margin:0 auto 30px;text-wrap:pretty;\n  }\n  .price-block .cta{\n    background:var(--paper);color:var(--ink);\n  }\n  .price-block .cta:hover{background:#fff;}\n  .price-block .cta .price{border-left-color:rgba(44,42,38,.18);}\n  .price-block .cta-note{color:rgba(250,248,243,.5);}\n\n  /* author */\n  .author{text-align:center;}\n  .author .name{font-family:var(--serif);font-size:30px;font-weight:500;margin-top:14px;}\n  .author .role{color:var(--ink-faint);font-size:13px;letter-spacing:0.16em;text-transform:uppercase;margin-top:6px;}\n  .author .bio{max-width:420px;margin:20px auto 0;font-weight:300;color:var(--ink-soft);font-size:16px;text-wrap:pretty;}\n  .author .ig{\n    display:inline-flex;align-items:center;gap:9px;\n    margin-top:24px;text-decoration:none;color:var(--ink);\n    font-size:14px;font-weight:500;letter-spacing:0.03em;\n    border:1px solid var(--line);border-radius:999px;padding:11px 20px;\n    transition:border-color .2s ease,background .2s ease;\n  }\n  .author .ig:hover{background:var(--paper);border-color:var(--ink-faint);}\n  .author .ig sup{font-size:11px;color:var(--ink-faint);}\n\n  /* footer */\n  footer{padding:44px 0 56px;border-top:1px solid var(--line);}\n  footer .wrap{text-align:center;}\n  footer a.mail{\n    font-family:var(--serif);font-size:23px;color:var(--ink);text-decoration:none;\n    border-bottom:1px solid var(--line);padding-bottom:2px;\n  }\n  footer a.mail:hover{border-color:var(--ink);}\n  footer .legal{\n    margin-top:26px;font-size:11.5px;line-height:1.7;color:var(--ink-faint);\n    font-weight:300;max-width:480px;margin-left:auto;margin-right:auto;text-wrap:pretty;\n  }\n\n  /* sticky mobile CTA */\n  .sticky{\n    position:fixed;left:0;right:0;bottom:0;z-index:40;\n    padding:14px 16px calc(14px + env(safe-area-ins
